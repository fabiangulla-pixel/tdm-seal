[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tdm-seal"
version = "0.6.0"
description = "Sellado declarativo de derechos TDM (TDMRep) para PDF editoriales"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pikepdf>=9.0.0",
    "lxml>=5.0.0",
    "click>=8.1.0",
    "iscc-core>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
gui = [
    "PySide6>=6.7.0",
    "pytest-qt>=4.4.0",
]
# ISCC de contenido (Text-Code): extracción de texto de PDF igual que iscc-sdk.
iscc = [
    "pypdfium2>=4.30.0",
]
# ISCC de contenido para EPUB: el mismo extractor (Tika) que usa iscc-sdk.
# Pesado (~110 MB); por eso va aparte y no entra en el .exe.
iscc-epub = [
    "iscc-tika>=0.6.0",
]

[project.scripts]
tdmseal = "tdmseal.cli:main"

[project.gui-scripts]
tdmseal-gui = "tdmseal.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "W"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
